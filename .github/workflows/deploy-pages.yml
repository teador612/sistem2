name: Deploy Oran Analiz Sistemi

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Maçkolik verisini güncelle"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository'i al
        uses: actions/checkout@v4

      - name: GitHub Pages ayarları
        uses: actions/configure-pages@v5

      - name: Statik dosyaları hazırla
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4
